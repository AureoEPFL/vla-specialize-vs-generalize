<text x="450.0" y="146" font-size="10.5" fill="#444444" text-anchor="middle">SmolLM2 · 16 layers</text>
<text x="450.0" y="160" font-size="10.5" fill="#444444" text-anchor="middle">visual + text + state</text>
<text x="450.0" y="174" font-size="10.5" fill="#444444" text-anchor="middle">tokens merged</text>
